name: job-scraper

services:


  # 5. Main scraper worker
  scraper-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scraper
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=INFO
      - PROMETHEUS_PORT=9410
      - JOBLEADS_SCHEDULE=${JOBLEADS_SCHEDULE:-0 */6 * * *}
    volumes:
      - ../config:/app/config
      - ..:/app
    networks:
      - scraper_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 7. Grafana dashboard - REMOVED


volumes: {}

networks:
  scraper_net:
    driver: bridge
