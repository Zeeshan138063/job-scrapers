name: job-scraper

services:

  # 4. Scraper API (FastAPI + SQLModel)
  scraper-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - API_SECRET_KEY=${API_SECRET_KEY}
    volumes:
      - ..:/app
    networks:
      - scraper_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 5. Main scraper worker
  scraper-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scraper
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=INFO
      - PROMETHEUS_PORT=9410
    volumes:
      - ../config:/app/config
      - ..:/app
    networks:
      - scraper_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 7. Grafana dashboard - REMOVED

  # 8. Admin dashboard
  dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8081}:80"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - API_SECRET_KEY=${API_SECRET_KEY}
    networks:
      - scraper_net

volumes: {}

networks:
  scraper_net:
    driver: bridge
